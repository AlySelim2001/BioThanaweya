name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Dynamic Workspace Setup & Verification
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml not found in root, searching workspace..."
            FOUND_PATH=$(find . -name "pubspec.yaml" -maxdepth 3 | head -n 1)
            if [ -n "$FOUND_PATH" ]; then
              DIR=$(dirname "$FOUND_PATH")
              echo "Found pubspec.yaml in $DIR. Moving to project root..."
              cd "$DIR"
            else
              echo "Error: pubspec.yaml not found anywhere in the repository."
              exit 1
            fi
          else
            echo "pubspec.yaml found successfully in root."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
            **/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
