name: BioThanaweya Secure Production CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_production_apk:
    name: Build & Sign Production APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Decode Production Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            # فك التشفير والتنظيف النقي وحفظ الملف في جذر المشروع مباشرة
            echo "$SIGNING_KEY_STORE_BASE64" | tr -d '\n' | tr -d ' ' | base64 -d > my-upload-key.jks
            echo "Keystore successfully decoded at root my-upload-key.jks"
          else
            echo "::error::SIGNING_KEY_STORE_BASE64 secret is missing or empty!"
            exit 1
          fi

      - name: Build Signed Release APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export OrgGradleJvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=my-upload-key.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Secure Clean up Keystore
        if: always()
        run: |
          rm -f my-upload-key.jks
          echo "Sensitive keystore securely wiped from runner environment."

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## 🧬 BioThanaweya Secure Production Release
            - ✅ تم توقيع وبناء التطبيق أوتوماتيكياً عبر سحابة GitHub Actions بمعايير الأمان القصوى.
            - 🛡️ 100% Offline-First ومطابق لمتطلبات النشر الرسمي لمنظومة الثانوية العامة المصرية.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
