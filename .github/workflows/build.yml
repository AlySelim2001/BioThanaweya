name: BioThanaweya Secure Production CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

jobs:
  build_production_apk:
    name: Build and Sign Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Decode Production Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            # تنظيف النص من أسطر الجديدة والمسافات وفك التشفير بأمان تام
            echo "$SIGNING_KEY_STORE_BASE64" | tr -d '\n' | tr -d ' ' | base64 -d > app/my-upload-key.jks
          else
            echo "Error: SIGNING_KEY_STORE_BASE64 secret is missing!"
            exit 1
          fi

      - name: Build Signed Release APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/my-upload-key.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Secure Clean up Keystore
        if: always()
        run: rm -f app/my-upload-key.jks

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## 🧬 BioThanaweya Secure Production Release
            - ✅ تم توقيع وبناء التطبيق أوتوماتيكياً عبر سحابة GitHub Actions بمعايير الأمان القصوى.
            - 🛡️ 100% Offline-First ومطابق لمتطلبات النشر الرسمي.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
