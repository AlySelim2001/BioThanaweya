name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project Root Directory
        run: |
          echo "Searching for pubspec.yaml..."
          PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          echo "Found project root at: $PROJECT_DIR"
          echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Build Flutter Release APK
        run: flutter build apk --release --verbose
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-release-apk
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30