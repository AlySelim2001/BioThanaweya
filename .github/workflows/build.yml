      - name: Locate Project Root & Configure
        id: locate-project
        run: |
          # البحث عن pubspec.yaml في الجذر مباشرة
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Found pubspec.yaml in root directly."
          else
            echo "Searching repository for pubspec.yaml..."
            # البحث الشامل عن pubspec.yaml في كافة مجلدات المستودع بدون قيود للعمق
            PUB_PATH=$(find . -name "pubspec.yaml" | head -n 1)
            if [ -n "$PUB_PATH" ]; then
              DIR=$(dirname "$PUB_PATH")
              DIR_CLEAN=${DIR#./}
              echo "PROJECT_DIR=$DIR_CLEAN" >> $GITHUB_ENV
              echo "Found project directory at: $DIR_CLEAN"
            else
              echo "CRITICAL Error: pubspec.yaml does not exist anywhere in this repository checkout."
              exit 1
            fi
          fi
