name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Locate Flutter Project Root and Move
        id: find-flutter
        run: |
          echo "=== Searching for pubspec.yaml ==="
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found pubspec.yaml at: $PUBSPEC_PATH"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Flutter Dependencies
        working-directory: ${{ env.project_dir }}
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: ${{ env.project_dir }}
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/**/*.apk
          retention-days: 30
