name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Direct Root Location & Diagnostics
        id: locate-root
        run: |
          echo "=== Listing Repository Contents ==="
          ls -R
          
          # البحث المباشر عن pubspec.yaml وتحديد مساره بدقة
          if [ -f "pubspec.yaml" ]; then
            echo "project_dir=." >> $GITHUB_ENV
            echo "Found pubspec.yaml in root."
          elif [ -f "BioThanaweya/pubspec.yaml" ]; then
            echo "project_dir=BioThanaweya" >> $GITHUB_ENV
            echo "Found pubspec.yaml in BioThanaweya subfolder."
          else
            # محاولة إيجاد أي مجلد يحتوي على pubspec.yaml
            DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
            echo "project_dir=$DIR" >> $GITHUB_ENV
            echo "Found pubspec.yaml in dynamic dir: $DIR"
          fi

      - name: Install Flutter Dependencies
        working-directory: ${{ env.project_dir }}
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: ${{ env.project_dir }}
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/**/*.apk
          retention-days: 30
