      - name: Decode Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            # إزالة أي أسطر جديدة أو مسافات زائدة وضمان سلامة النص قبل فك التشفير
            echo "$SIGNING_KEY_STORE_BASE64" | tr -d '\n' | tr -d ' ' | base64 --decode > app/my-upload-key.jks
          fi
