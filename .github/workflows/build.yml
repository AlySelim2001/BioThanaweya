name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Verify pubspec.yaml Location
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Found pubspec.yaml in repository root."
          elif [ -f "smarts.bio/pubspec.yaml" ]; then
            echo "Found in smarts.bio directory."
          else
            echo "Searching for pubspec.yaml..."
            find . -name "pubspec.yaml"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: . # قم بتعديل النقطة إلى مسار المجلد الفرعي إذا كان ملف pubspec.yaml ليس في الجذر (مثال: smarts.bio)

      - name: Build Flutter Release APK
        run: flutter build apk --release --verbose
        working-directory: . # نفس المسار هنا أيضاً

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
