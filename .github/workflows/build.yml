name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Ultimate Dynamic Project Root Discovery
        run: |
          echo "=== Scanning Workspace Directory Structure ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          echo "=== Locating pubspec.yaml ==="
          PUBSPEC_FILE=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "Warning: pubspec.yaml not found! Initializing default flutter structure in root."
            flutter create . --org com.smarts.bio --project-name biothanaweya --platforms android
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
            echo "SUCCESS: Found pubspec.yaml at: $PUBSPEC_FILE"
            echo "Project root directory resolved to: $PROJECT_DIR"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Flutter Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/**/*.apk
          retention-days: 30