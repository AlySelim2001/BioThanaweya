name: BioThanaweya Release CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة عمل Flutter (تتضمن Dart SDK تلقائياً، فلا داعي لفصل setup-dart)
      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # تثبيت إصدار مستقر ومحدد بدقة لتجنب أخطاء الـ API الديناميكي
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 3. جلب كافة الاعتماديات والمكتبات من pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get

      # 4. إجراء الفحص الثابت للكود والتأكد من توافق الأنواع (Static Analysis)
      - name: Run Flutter Analyze
        run: flutter analyze

      # 5. تشغيل اختبارات الوحدة للتأكد من سلامة خوارزميات FSRS وبنك الأسئلة
      - name: Run Unit Tests
        run: flutter test

      # 6. بناء وتجميع ملف الـ APK بنسخة الإنتاج الحقيقية (Release APK - Split per ABI)
      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      # 7. رفع ملف الـ APK الناتج كـ Artifact دائم داخل صفحة الـ Action
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-release-apks
          path: build/app/outputs/flutter-apk/app-release.apk

      # 8. النشر التلقائي لملف الـ APK في قسم الـ Releases عند إنشاء Tag جديد
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 🧬 BioThanaweya Production Release
            - ✅ تم بناء التطبيق تلقائياً عبر سحابة GitHub Actions.
            - 🛡️ معتمد بنسبة 100% Offline-First وخالٍ من أي تبعات سحابية.
            - 🌟 يشمل محرك الاختبارات FSRS ومختبر الرسومات الحيوية والمساعد الذكي.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
