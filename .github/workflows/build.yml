name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Project Structure
        run: |
          echo "=== Checking Root Files ==="
          ls -la
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found in root directory!"
            exit 1
          fi

      - name: Setup Android SDK Licenses
        run: |
          mkdir -p android/app
          # توليد مفطر توقيع افتراضي تلقائي لتفادي أي فشل إذا كان الـ Keystore غير مسجل في الـ Secrets
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=smarts.bio, OU=EdTech, O=ScholarSidekick, L=Cairo, S=Cairo, C=EG" || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
