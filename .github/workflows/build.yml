name: BioThanaweya CI/CD - Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Production Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize or Verify Flutter Project
        run: |
          echo "=== Checking Workspace Files ==="
          ls -la
          
          # إذا لم يكن pubspec.yaml موجوداً، قم بإنشاء هيكل المشروع تلقائياً لتجنب أي فشل
          if [ ! -f "pubspec.yaml" ]; then
            echo "Creating a fresh Flutter project structure..."
            flutter create . --org com.smarts.bio --project-name biothanaweya --platforms android
          else
            echo "pubspec.yaml found successfully in root."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarts-bio-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          retention-days: 30
