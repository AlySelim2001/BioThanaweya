name: BioThanaweya Android Release CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

jobs:
  build_android_release:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (JDK 17) اللازمة لتنسيق وبناء مشاريع أندرويد الحديثة
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. منح صلاحيات التنفيد لملف gradlew لكي يعمل بسلاسة على سحابة أوبونتو
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء ملف الـ APK لنسخة الإنتاج (Release APK) باستخدام Gradle مباشرة
      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      # 5. رفع ملف الـ APK الناتج كـ Artifact دائم داخل صفحة الـ Action
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-android-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # 6. النشر التلقائي لملف الـ APK في قسم الـ Releases عند إنشاء Tag جديد
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
          body: |
            ## 🧬 BioThanaweya Production Release (Android Native)
            - ✅ تم بناء وتجميع التطبيق أوتوماتيكياً عبر Gradle وسحابة GitHub Actions.
            - 🛡️ معتمد بنسبة 100% Offline-First وخالٍ من أي تبعات سحابية.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
