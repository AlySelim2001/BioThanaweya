name: BioThanaweya Flutter Multi-Platform CI/CD & Android Release Pipeline

on:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for this build run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-preflight-and-test:
    name: 🧪 Flutter Quality Assurance & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: 💙 Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Retrieve Flutter Dependencies
        run: flutter pub get

      - name: 🛡️ Strict Static Analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Execute Flutter Unit & Widget Test Suite
        run: flutter test --coverage

  flutter-android-build:
    name: 📱 Flutter Android APK & AAB Compilation
    needs: flutter-preflight-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: 🤖 Setup Android SDK
       uses: android-actions/setup-android@v3
       with:
         api-level: 34
         build-tools-version: "34.0.0"
         cmdline-tools-version: "11076708_latest"

      - name: 📜 Accept SDK Licenses Non-Interactively
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "SDK licenses accepted successfully."

      - name: 💙 Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Fetch Packages
        run: flutter pub get

      - name: 🔑 Check Android Signing Configuration
        id: resolve-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Decoding production keystore from GitHub Secrets..."
            KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No release keystore secret found; will build debug APK."
          fi

      - name: 🚀 Build Universal Debug APK
        run: |
          flutter build apk --debug

      - name: 📦 Build Release Android APKs & AAB (Optional)
        if: steps.resolve-keystore.outputs.has_keystore == 'true'
        run: |
          flutter build apk --split-per-abi --release
          flutter build apk --release
          flutter build appbundle --release

      - name: 🛡️ Collect Binaries & Compute SHA-256 Checksums
        run: |
          mkdir -p release-binaries
          
          # Copy Universal and Split APKs
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} release-binaries/ \;
          
          # Copy AAB Bundle
          find build/app/outputs/bundle/release/ -name "*.aab" -exec cp {} release-binaries/BioThanaweya-release.aab \;
          
          cd release-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          
          echo "### 🔐 Release Binary Integrity Matrix" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Archive Android Artifacts (APKs, AAB & Checksums)
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-flutter-binaries
          path: release-binaries/
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/*.apk
            release-binaries/*.aab
            release-binaries/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
