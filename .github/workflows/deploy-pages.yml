name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  metadata: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build PWA production bundle
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          # The artifact 'dist/' contains the PWA build output
          artifact_name: web-dist
          # GitHub Actions automatically publishes from the 'main' branch
          # when the 'github-pages' environment is used with the 'deploy-pages' action

  # Optional: Add a job to verify the deployed PWA
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed files exist
        run: |
          ls dist/index.html
          ls dist/assets/*.css
          ls dist/assets/*.js
        timeout-minutes: 5