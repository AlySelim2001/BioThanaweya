name: Build Android APK
on:
  push:
    branches: [ main, feature/mobile-app ]
    paths: [ 'mobile/**', '.github/workflows/android-apk-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'mobile/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0', channel: 'stable', cache: true }
      - name: Clean Flutter cache
        run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: Mobile Build v${{ github.run_number }}
          files: mobile/build/app/outputs/flutter-apk/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
