name: Freebuff Direct Execution Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  execute-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js / Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Freebuff Connection & Workspace Sync
        run: |
          echo "Connected to Freebuff Execution Engine successfully."
          git config --global user.name "Freebuff Bot"
          git config --global user.email "bot@freebuff.local"
          git status
