name: BioThanaweya Production Build & Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for this run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-and-web:
    name: 🌐 Web Pre-Flight & Bundle Compilation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🛡️ Strict TypeScript Type Verification (tsc --noEmit)
        run: npm run lint

      - name: 🧪 Execute Automated Vitest Test Suite
        run: npm test

      - name: 🏗️ Compile Production PWA Bundle
        run: npm run build

      - name: 📤 Archive Web Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-web-dist
          path: dist/
          retention-days: 30

  android-build:
    name: 📱 Android APK & AAB Compilation
    needs: preflight-and-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Download Web Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: biothanaweya-web-dist
          path: dist/

      - name: 🔄 Synchronize Offline Assets to Android Container
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "Synchronized $(find android/app/src/main/assets/public -type f | wc -l) assets to Android container."

      - name: 🧩 Synthesize google-services.json (if missing)
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"biothanaweya"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.biothanaweya.app"}}}]}' > android/app/google-services.json
            echo "Synthesized placeholder google-services.json"
          fi

      - name: 🔑 Resolve Android Release Keystore
        id: resolve-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          elif [ -f "android/app/keystores/biothanaweya-release-key.jks" ]; then
            echo "Using bundled repository release key..."
            cp android/app/keystores/biothanaweya-release-key.jks "${KEYSTORE_PATH}"
          else
            echo "Generating fallback signing key for CI workflow..."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias "biothanaweya-alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "bio_secure_2026_pass" -keypass "bio_secure_2026_pass" \
              -dname "CN=BioThanaweya CI, OU=Engineering, O=BioThanaweya, L=Cairo, C=EG"
          fi
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV

      - name: ⚙️ Grant Execution Rights to Gradle Wrapper
        run: |
          cd android
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: 🚀 Compile Universal Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'bio_secure_2026_pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'biothanaweya-alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bio_secure_2026_pass' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Compile Google Play App Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'bio_secure_2026_pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'biothanaweya-alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bio_secure_2026_pass' }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🛡️ Compute SHA-256 Cryptographic Integrity Checksums
        run: |
          mkdir -p release-binaries
          
          # Find and stage APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-binaries/BioThanaweya-release.apk
          fi
          
          # Find and stage AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" release-binaries/BioThanaweya-release.aab
          fi

          cd release-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "### 🔐 Release Binary Integrity Verification" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Archive Binary Artifacts (APK, AAB & Checksums)
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-android-binaries
          path: release-binaries/
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/BioThanaweya-release.apk
            release-binaries/BioThanaweya-release.aab
            release-binaries/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
