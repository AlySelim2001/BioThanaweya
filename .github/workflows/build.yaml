name: BioThanaweya Production Build & Multi-Platform Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for this run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-and-web:
    name: 🌐 Web Pre-Flight & Bundle Compilation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🛡️ Strict TypeScript Type Verification (tsc --noEmit)
        run: npm run lint

      - name: 🧪 Execute Automated Vitest Test Suite
        run: npm test

      - name: 🏗️ Compile Production PWA Bundle
        run: npm run build

      - name: 📤 Archive Web Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-web-dist
          path: dist/
          retention-days: 30

  android-build:
    name: 📱 Android Native Container APK Compilation
    needs: preflight-and-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🤖 Setup Android SDK
       uses: android-actions/setup-android@v3
       with:
         api-level: 34
         build-tools-version: "34.0.0"
         cmdline-tools-version: "11076708_latest"

      - name: 📜 Accept SDK Licenses Non-Interactively
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "SDK licenses accepted successfully."

      - name: 📥 Download Web Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: biothanaweya-web-dist
          path: dist/

      - name: 🔄 Synchronize Offline Assets to Android Container
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "Synchronized $(find android/app/src/main/assets/public -type f | wc -l) assets to Android container."

      - name: 🧩 Synthesize google-services.json (if missing)
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"biothanaweya"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.biothanaweya.app"}}}]}' > android/app/google-services.json
            echo "Synthesized placeholder google-services.json"
          fi

      - name: ⚙️ Grant Execution Rights to Gradle Wrapper
        run: |
          cd android
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: 🚀 Compile Universal Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔑 Check Release Keystore Configuration
        id: check-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Release keystore detected in GitHub Secrets."
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No release keystore configured; building debug APK artifact."
          fi

      - name: 📦 Compile Signed Release APK & AAB (Optional)
        if: steps.check-keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 🛡️ Stage Binaries & Compute SHA-256 Checksums
        run: |
          mkdir -p output-binaries
          
          # Stage Debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-binaries/BioThanaweya-debug.apk
            echo "Staged Debug APK: $(ls -lh output-binaries/BioThanaweya-debug.apk)"
          fi
          
          # Stage Release APK if built
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-binaries/BioThanaweya-release.apk
            echo "Staged Release APK: $(ls -lh output-binaries/BioThanaweya-release.apk)"
          fi
          
          # Stage Release AAB if built
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1 || true)
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" output-binaries/BioThanaweya-release.aab
            echo "Staged Release AAB: $(ls -lh output-binaries/BioThanaweya-release.aab)"
          fi

          cd output-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "### 🔐 Android Binary Artifacts & SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Archive Android Binaries (APK & Checksums)
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-android-apk
          path: output-binaries/
          retention-days: 30

  flutter-qa-and-build:
    name: 💙 Flutter QA & Multi-ABI Split APK Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🤖 Setup Android SDK
       uses: android-actions/setup-android@v3
       with:
         api-level: 34
         build-tools-version: "34.0.0"
         cmdline-tools-version: "11076708_latest"

      - name: 📜 Accept SDK Licenses Non-Interactively
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "SDK licenses accepted successfully."

      - name: 💙 Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 📦 Retrieve Flutter Dependencies
        run: flutter pub get

      - name: 🛡️ Strict Static Analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Execute Flutter Unit & Widget Test Suite
        run: flutter test

      - name: 🔑 Check Release Keystore Configuration
        id: check-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Release keystore detected in GitHub Secrets."
            KEYSTORE_PATH="$RUNNER_TEMP/flutter-release.jks"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No release keystore secret found; compiling debug split APKs."
          fi

      - name: 🚀 Compile Flutter Universal & Split APKs (Debug)
        run: |
          flutter build apk --split-per-abi --debug
          flutter build apk --debug

      - name: 📦 Compile Flutter Release APKs & AAB (Optional)
        if: steps.check-keystore.outputs.has_keystore == 'true'
        run: |
          flutter build apk --split-per-abi --release
          flutter build apk --release
          flutter build appbundle --release

      - name: 🛡️ Stage Flutter Binaries & Compute SHA-256 Checksums
        run: |
          mkdir -p flutter-binaries
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} flutter-binaries/ \;
          find build/app/outputs/bundle/ -name "*.aab" -exec cp {} flutter-binaries/ \; 2>/dev/null || true
          
          cd flutter-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "### 📱 Flutter APK Artifacts & SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Archive Flutter Binaries
        uses: actions/upload-artifact@v4
        with:
          name: biothanaweya-flutter-binaries
          path: flutter-binaries/
          retention-days: 30

  publish-release:
    name: 🚀 Publish Unified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    needs: [preflight-and-web, android-build, flutter-qa-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Android Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: biothanaweya-android-apk
          path: release-assets/android

      - name: 📥 Download Flutter Binaries
        uses: actions/download-artifact@v4
        with:
          name: biothanaweya-flutter-binaries
          path: release-assets/flutter

      - name: 🚀 Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
