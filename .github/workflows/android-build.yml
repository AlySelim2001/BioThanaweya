name: Android Build

on:
  push:
    branches: [main, release/fixes-v1.1.8]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read
  packages: read

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=512'
  ANDROID_SDK_ROOT: '/opt/android/sdk'
  ANDROID_BUILD_TOOLS: '36.0.0'
  JAVA_HOME: '/usr/lib/jvm/temurin-21-jdk-amd64'
  CAPACITOR_BUILD: 'true'

jobs:
  web-build:
    name: Web Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.npm,node_modules,dist
          key: runner-os-vite-${{ hashFiles('package.json','vite.config.ts') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: runner-os-vite-
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: export CI=true && export CAPACITOR_BUILD=true && npm run build
      - run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then echo "Build output 'dist' is missing or empty"; exit 1; fi
          echo "Production build output verified"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 7

  capacitor-sync:
    name: Capacitor Sync
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.npm,node_modules
          key: runner-os-capacitor-${{ hashFiles('package.json') }}-${{ hashFiles('capacitor.config.ts') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: runner-os-capacitor-
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g @capacitor/cli @capacitor/android@^8.6.2
      - run: npx capacitor sync android
      - run: |
          if [ ! -d android/app/src/main/assets/public ]; then mkdir -p android/app/src/main/assets/public; fi
          ASSET_COUNT=$(find android/app/src/main/assets/public -type f 2>/dev/null | wc -l)
          echo "Assets in Android container: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -eq 0 ]; then echo "No assets found"; else echo "Capacitor sync complete"; fi

  android-apk:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: capacitor-sync
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.gradle,**/node_modules/.cache
          key: runner-os-gradle-${{ hashFiles('gradle.properties') }}-${{ hashFiles('package.json') }}-${{ hashFiles('android/**/*.*)' }}
          restore-keys: runner-os-gradle-
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '>=8.4'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper
      - run: chmod +x android/gradlew && export ANDROID_SDK_ROOT='/opt/android/sdk' && export ANDROID_BUILD_TOOLS='36.0.0'
      - run: export ANDROID_SDK_ROOT='/opt/android/sdk' && export ANDROID_BUILD_TOOLS='36.0.0' && export ANDROID_NDK_ROOT='/opt/android/ndk' && cd android && ./gradlew assembleDebug --no-daemon --stacktrace -Porg.gradle.jvmargs='--max-old-space-size=512'
      - run: |
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null)
          if [ -z "$DEBUG_APK" ]; then echo "Debug APK not found"; exit 1; fi
          echo "Debug APK: $DEBUG_APK"
          echo "APK_PATH=$DEBUG_APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  apk-verification:
    name: APK Metadata Verification
    runs-on: ubuntu-latest
    needs: android-apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
      - run: |
          APK_PATH="${{ env.APK_PATH }}"
          echo "Verifying APK: $APK_PATH"
          aapt2 l dump badging "$APK_PATH" | grep -E '(package:|versionName|versionCode|application-label)'
          PACKAGE=$(aapt2 l dump badging "$APK_PATH" | grep 'package:' | sed -n 's/.*name="\([^"]*\)".*/\1/p')
          echo "Package name: $PACKAGE"
          if [ "$PACKAGE" = "com.aistudio.biothanaweya.exam" ]; then echo "Package identity verified"; fi
      - run: |
          sha256sum "$APK_PATH" | tee sha256-output.txt
          HASH=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "APK_SHA256=$HASH" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: sha256-sums
          path: sha256-output.txt
          retention-days: 30
      - run: apksigner verify --verbose "$APK_PATH" 2>&1 || echo "Debug APK signature note"