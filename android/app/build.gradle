plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.biothanaweya.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.biothanaweya.app'
        minSdk 26
        targetSdk 34
        versionCode 114
        versionName '1.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.isFile()) {
                localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
            }

            def keystorePath = System.getenv('KEYSTORE_PATH') ?: localProperties.getProperty('KEYSTORE_PATH')
            def storePasswordValue = System.getenv('KEYSTORE_PASSWORD') ?: localProperties.getProperty('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS') ?: localProperties.getProperty('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD') ?: localProperties.getProperty('KEY_PASSWORD')
            def keystoreFile = keystorePath ? rootProject.file(keystorePath) : null

            if (keystoreFile?.isFile() && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile keystoreFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else {
                logger.lifecycle('Release signing credentials are incomplete or unavailable; release variants will use the debug signing key.')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release {
            def releaseSigningReady = signingConfigs.release.storeFile?.isFile() &&
                signingConfigs.release.storePassword &&
                signingConfigs.release.keyAlias &&
                signingConfigs.release.keyPassword
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}