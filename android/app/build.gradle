plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.biothanaweya.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.biothanaweya.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(
                System.getenv("KEYSTORE_PATH") ?: 
                keystoreProperties['KEYSTORE_PATH'] ?: 
                'keystores/biothanaweya-release-key.jks'
            )
            storePassword(
                System.getenv("KEYSTORE_PASSWORD") ?: 
                System.getenv("STORE_PASSWORD") ?: 
                keystoreProperties['KEYSTORE_PASSWORD'] ?: 
                keystoreProperties['STORE_PASSWORD'] ?: 
                "bio_secure_2026_pass"
            )
            keyAlias(
                System.getenv("KEY_ALIAS") ?: 
                keystoreProperties['KEY_ALIAS'] ?: 
                "biothanaweya-alias"
            )
            keyPassword(
                System.getenv("KEY_PASSWORD") ?: 
                keystoreProperties['KEY_PASSWORD'] ?: 
                "bio_secure_2026_pass"
            )
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
