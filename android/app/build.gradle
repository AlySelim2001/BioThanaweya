plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.biothanaweya.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.biothanaweya.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: keystoreProperties['KEYSTORE_PATH']
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: System.getenv("STORE_PASSWORD") ?: keystoreProperties['KEYSTORE_PASSWORD'] ?: keystoreProperties['STORE_PASSWORD']
                keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties['KEY_ALIAS']
                keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: keystoreProperties['KEYSTORE_PATH']
            if (ksPath && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
