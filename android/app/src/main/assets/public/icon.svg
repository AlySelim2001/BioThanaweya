<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#14B8A6" stroke-width="4" stroke-opacity="0.3" />

  <!-- DNA Double Helix Art -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Base pair rungs -->
    <line x1="-70" y1="-140" x2="70" y2="-140" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="-90" y1="-80" x2="90" y2="-80" stroke="#14B8A6" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="-100" y1="-20" x2="100" y2="-20" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="-90" y1="40" x2="90" y2="40" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="-70" y1="100" x2="70" y2="100" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="-40" y1="150" x2="40" y2="150" stroke="#14B8A6" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Left Strand -->
    <path d="M-80,-180 C-120,-100 -120,-40 -80,40 C-40,120 -20,160 -40,190" fill="none" stroke="url(#dnaGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Right Strand -->
    <path d="M80,-180 C120,-100 120,-40 80,40 C40,120 20,160 40,190" fill="none" stroke="url(#dnaGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Central Micro-Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#F59E0B" />
    <circle cx="0" cy="-20" r="12" fill="#10B981" />
    <circle cx="0" cy="100" r="10" fill="#EC4899" />
  </g>

  <!-- Typography Mark -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="4">
    BIOTHANAWEYA
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#14B8A6" text-anchor="middle" letter-spacing="2">
    FOSS EGYPTIAN BIOLOGY
  </text>
</svg>
